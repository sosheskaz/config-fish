pre-commit:
  parallel: true
  commands:
    fish-syntax:
      glob: "**.fish"
      run: |
        for file in {staged_files}; do
          fish -n "$file" || exit 1
        done

    trailing-whitespace:
      run: |
        for file in {staged_files}; do
          if grep -Pn '\s+$' "$file" >/dev/null 2>&1; then
            echo "trailing whitespace: $file"
            grep -Pn '\s+$' "$file"
            exit 1
          fi
        done

    actionlint:
      glob: ".github/workflows/*.{yaml,yml}"
      run: mise exec -- actionlint {staged_files}

    renovate:
      glob: "{renovate.{json,json5},.github/renovate.{json,json5}}"
      run: mise exec -- renovate-config-validator

commit-msg:
  commands:
    conventional:
      run: |
        commit_msg_file="{1}"
        if ! grep -Eq '^(feat|fix|refactor|test|docs|chore|build|ci|perf|deps)(\([a-z]+\))?!?: .+' "$commit_msg_file"; then
          echo "invalid commit message. use conventional commits: type(scope): subject"
          exit 1
        fi
